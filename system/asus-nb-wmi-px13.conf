# PX13 (HN7306WU): report the 360-degree hinge as SW_TABLET_MODE.
# The firmware supports the lid-flip WMI device (0x00060062), but asus-nb-wmi
# has no DMI quirk for this model, so "auto" creates no tablet-mode switch.
# Plasma uses the switch for touch mode, the on-screen keyboard and rotation.
options asus_nb_wmi tablet_mode_sw=2
